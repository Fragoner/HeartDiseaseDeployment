<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Prediction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .form-container {
            padding: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }

        .form-group input, .form-group select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .btn-predict {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .result-container {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .result-container.healthy {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
        }

        .result-container.danger {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
        }

        .result-container h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .result-container p {
            opacity: 0.9;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Heart Disease Prediction System</h1>
            <p>Enter patient clinical parameters to assess heart disease risk</p>
        </header>

        <div class="form-container">
            <form id="predictionForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="age">Age</label>
                        <input type="number" id="age" name="age" required min="1" max="120">
                    </div>

                    <div class="form-group">
                        <label for="sex">Sex</label>
                        <select id="sex" name="sex" required>
                            <option value="1">Male</option>
                            <option value="0">Female</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="cp">Chest Pain Type (cp)</label>
                        <select id="cp" name="cp" required>
                            <option value="0">0 - Typical Angina</option>
                            <option value="1">1 - Atypical Angina</option>
                            <option value="2">2 - Non-Anginal Pain</option>
                            <option value="3">3 - Asymptomatic</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="trestbps">Resting Blood Pressure (trestbps)</label>
                        <input type="number" id="trestbps" name="trestbps" required min="50" max="250">
                    </div>

                    <div class="form-group">
                        <label for="chol">Cholesterol (chol)</label>
                        <input type="number" id="chol" name="chol" required min="0" max="600">
                    </div>

                    <div class="form-group">
                        <label for="fbs">Fasting Blood Sugar > 120 (fbs)</label>
                        <select id="fbs" name="fbs" required>
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="restecg">Resting ECG Results (restecg)</label>
                        <select id="restecg" name="restecg" required>
                            <option value="0">0 - Normal</option>
                            <option value="1">1 - ST-T Wave Abnormality</option>
                            <option value="2">2 - Left Ventricular Hypertrophy</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="thalach">Max Heart Rate (thalach)</label>
                        <input type="number" id="thalach" name="thalach" required min="50" max="250">
                    </div>

                    <div class="form-group">
                        <label for="exang">Exercise Induced Angina (exang)</label>
                        <select id="exang" name="exang" required>
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="oldpeak">ST Depression (oldpeak)</label>
                        <input type="number" id="oldpeak" name="oldpeak" required min="0" max="10" step="0.1">
                    </div>

                    <div class="form-group">
                        <label for="slope">Slope of Peak Exercise ST (slope)</label>
                        <select id="slope" name="slope" required>
                            <option value="0">0 - Upsloping</option>
                            <option value="1">1 - Flat</option>
                            <option value="2">2 - Downsloping</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="ca">Number of Major Vessels (ca)</label>
                        <select id="ca" name="ca" required>
                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="thal">Thalassemia (thal)</label>
                        <select id="thal" name="thal" required>
                            <option value="0">0 - Normal</option>
                            <option value="1">1 - Fixed Defect</option>
                            <option value="2">2 - Reversible Defect</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-predict">Predict Heart Disease Risk</button>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Analyzing patient data...</p>
            </div>

            <div class="result-container" id="result"></div>
        </div>

        <footer>
            <p>Heart Disease Prediction System | AI-ML Assignment 10</p>
        </footer>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            
            // Collect form data
            const formData = {
                age: parseInt(document.getElementById('age').value),
                sex: parseInt(document.getElementById('sex').value),
                cp: parseInt(document.getElementById('cp').value),
                trestbps: parseInt(document.getElementById('trestbps').value),
                chol: parseInt(document.getElementById('chol').value),
                fbs: parseInt(document.getElementById('fbs').value),
                restecg: parseInt(document.getElementById('restecg').value),
                thalach: parseInt(document.getElementById('thalach').value),
                exang: parseInt(document.getElementById('exang').value),
                oldpeak: parseFloat(document.getElementById('oldpeak').value),
                slope: parseInt(document.getElementById('slope').value),
                ca: parseInt(document.getElementById('ca').value),
                thal: parseInt(document.getElementById('thal').value)
            };
            
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                // Hide loading
                document.getElementById('loading').style.display = 'none';
                
                // Show result
                const resultDiv = document.getElementById('result');
                resultDiv.style.display = 'block';
                
                if (data.prediction.includes('No')) {
                    resultDiv.className = 'result-container healthy';
                    resultDiv.innerHTML = `
                        <h3>✓ Low Risk</h3>
                        <p>${data.prediction}</p>
                        <p>Confidence: ${(data.probability * 100).toFixed(1)}%</p>
                    `;
                } else {
                    resultDiv.className = 'result-container danger';
                    resultDiv.innerHTML = `
                        <h3>⚠ High Risk</h3>
                        <p>${data.prediction}</p>
                        <p>Confidence: ${(data.probability * 100).toFixed(1)}%</p>
                    `;
                }
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                const resultDiv = document.getElementById('result');
                resultDiv.style.display = 'block';
                resultDiv.className = 'result-container danger';
                resultDiv.innerHTML = `<h3>Error</h3><p>${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
